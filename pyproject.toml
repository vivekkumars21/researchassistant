[project]
name = "multiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivekkumars21", email = "vivekvishwakarma21@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "fastapi",
    "google-genai",
    "langchain",
    "langchain-classic",
    "langchain-community",
    "langchain-core",
    "langchain-google-genai",
    "langgraph",
    "lxml",
    "pydantic",
    "python-dotenv",
    "requests",
    "rich",
    "streamlit",
    "tavily-python",
    "uvicorn[standard]",
]

[project.scripts]
multiagent = "multiagent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
